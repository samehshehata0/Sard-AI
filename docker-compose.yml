# Sard AI: web app, Python backend (API + job worker) and MongoDB.
#
#   docker compose up --build
#
# Put real settings in .env (see .env.example). The NotebookLM login is made on the host with
# `npm run auth` and shared with the container through ./backend/auth, so set
#   NOTEBOOKLM_STORAGE_STATE_PATH=auth/storage_state.json
# in .env before running it.
#
# If port 3000 or 8000 is already used on your machine, publish on other ports without editing this
# file: set SARD_FRONTEND_PORT and/or SARD_BACKEND_PORT in .env (for example SARD_FRONTEND_PORT=3001).
# These only choose the port on your machine; they are not the BACKEND_PORT that run.py reads inside
# the container. When the login expires, the jobs wait; run `npm run auth` again and
# they resume by themselves.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--quiet"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The API and the job worker run in this one process (JOB_WORKER_ENABLED, on by default).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SARD_BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_RELOAD: "false"
      # A container has no screen, so the browser must stay headless here whatever .env says. To watch
      # the browser, run the backend on your machine instead (npm run backend).
      PLAYWRIGHT_HEADLESS: "true"
      MONGODB_URI: mongodb://mongo:27017
      TEMP_DIR: /data/temp
      NOTEBOOKLM_STORAGE_STATE_PATH: /data/auth/storage_state.json
    volumes:
      - backend_temp:/data/temp
      - ./backend/auth:/data/auth:ro
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SARD_FRONTEND_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017
      PYTHON_BACKEND_URL: http://backend:8000
      # NEXT_PUBLIC_API_URL is deliberately not set: while it is unset the UI uses its mock data for
      # the parts of the app that have no real REST API yet (see CLAUDE.md).
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  mongo_data:
  backend_temp:
